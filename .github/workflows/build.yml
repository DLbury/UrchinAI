name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller
          pip install --no-cache-dir -r backend/requirements.txt

      - name: Verify Python packages
        run: |
          pip list | grep -E "(nanobot|litellm|anthropic|openai)"
          python -c "import nanobot_ai; print('nanobot_ai location:', nanobot_ai.__file__)"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build backend
        run: npm run build:backend:linux

      - name: Check backend binary size
        run: |
          ls -lh backend/urchinai-backend || echo "Backend binary not found"

      - name: Build Electron app
        run: npm run dist:linux

      - name: Check release size
        run: |
          ls -lh release/*.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: urchinai-linux
          path: release/*.deb

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller
          pip install --no-cache-dir -r backend/requirements.txt

      - name: Verify Python packages
        run: |
          pip list | findstr -E "(nanobot|litellm|anthropic|openai)"
          python -c "import nanobot_ai; print('nanobot_ai location:', nanobot_ai.__file__)"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build backend
        run: npm run build:backend:win

      - name: Check backend binary size
        run: |
          Get-ChildItem backend/urchinai-backend.exe | Select-Object Name, Length

      - name: Build Electron app
        run: npm run dist:win

      - name: Check release size
        run: |
          Get-ChildItem release/*.exe | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: urchinai-windows
          path: release/*.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: urchinai-linux
          path: release/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: urchinai-windows
          path: release/windows

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/linux/*.deb
            release/windows/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
